<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-in sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · authentication</p>
    <h1>Sign-in sequence</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sems-sequence-login-title sems-sequence-login-desc">
        <title id="sems-sequence-login-title">Sign-in sequence</title>
        <desc id="sems-sequence-login-desc">A password check either clears the failure count and audits a successful sign-in, or records the failure, may lock the account, and audits the failure. The browser returns to the login page on failure.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <rect x="64" y="252" width="820" height="432" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="64" y="252" width="44" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="86" y="264" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="120" y="284" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[password matches]</text>
        <line x1="76" y1="456" x2="872" y2="456" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="120" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[wrong password]</text>

        <line x1="120" y1="80" x2="120" y2="700" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="340" y1="80" x2="340" y2="700" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="560" y1="80" x2="560" y2="700" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="800" y1="80" x2="800" y2="700" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <line x1="120" y1="128" x2="340" y2="128" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="340" y1="172" x2="560" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="560" y1="216" x2="340" y2="216" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="340" y1="320" x2="560" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="340" y1="364" x2="800" y2="364" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="340" y1="408" x2="120" y2="408" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="340" y1="516" x2="560" y2="516" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="560" y1="560" x2="340" y2="560" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="340" y1="604" x2="800" y2="604" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="340" y1="648" x2="120" y2="648" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>

        <rect x="186" y="108" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="230" y="117" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POST LOGIN</text>
        <rect x="406" y="152" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="450" y="161" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LOAD ACCOUNT</text>
        <rect x="418" y="196" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="450" y="205" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ACCOUNT</text>
        <rect x="406" y="300" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="450" y="309" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CLEAR COUNT</text>
        <rect x="522" y="344" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="570" y="353" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LOGIN SUCCESS</text>
        <rect x="206" y="388" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="230" y="397" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HOME</text>
        <rect x="406" y="496" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="450" y="505" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RECORD FAIL</text>
        <rect x="410" y="540" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="450" y="549" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LOCK STATUS</text>
        <rect x="526" y="584" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="570" y="593" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LOGIN FAILED</text>
        <rect x="186" y="628" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="230" y="637" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LOGIN ERROR</text>

        <rect x="336" y="116" width="8" height="544" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <rect x="42" y="28" width="156" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="42" y="28" width="156" height="52" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="120" y="58" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Browser</text>

        <rect x="262" y="28" width="156" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="262" y="28" width="156" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="340" y="58" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Spring Security</text>

        <rect x="482" y="28" width="156" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="482" y="28" width="156" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="560" y="58" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Attempt service</text>

        <rect x="722" y="28" width="156" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="722" y="28" width="156" height="52" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="800" y="58" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Audit log</text>

        <line x1="40" y1="732" x2="920" y2="732" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="756" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="120" y1="752" x2="152" y2="752" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="160" y="756" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Call</text>
        <line x1="220" y1="752" x2="252" y2="752" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="260" y="756" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Return</text>
        <line x1="330" y1="752" x2="362" y2="752" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="370" y="756" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Signed in</text>
        <line x1="460" y1="752" x2="492" y2="752" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="500" y="756" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Browser HTTP</text>
      </svg>
    </div>
  </div>
</body>
</html>
