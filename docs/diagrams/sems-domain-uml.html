<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEMS domain · UML class diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1040px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.75rem;
    }

    .note {
      font-size: 0.95rem;
      line-height: 1.45;
      color: var(--color-muted);
      max-width: 42rem;
      margin-bottom: 1.5rem;
    }

    .diagram-container { width: 100%; overflow-x: auto; }

    svg { width: 100%; min-width: 960px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">UML class · Diagram Design</p>
    <h1>SEMS domain</h1>
    <p class="note">Employee is the hub. An account belongs to one employee, a leave request names that employee and an optional reviewer, and an audit event stores the actor by id rather than by object link. Enums stay on the attributes. Getters are omitted.</p>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sems-domain-title sems-domain-desc">
        <title id="sems-domain-title">SEMS domain</title>
        <desc id="sems-domain-desc">Class diagram of Employee, UserAccount, LeaveRequest, and AuditEvent, with account, leave, and reviewer associations.</desc>
        <defs>
          <marker id="sems-domain-triangle" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 0, 16 6, 0 12" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
          </marker>
          <marker id="sems-domain-diamond-filled" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 5, 9 0, 18 5, 9 10" fill="#2d3142"/>
          </marker>
          <marker id="sems-domain-diamond-hollow" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 5, 9 0, 18 5, 9 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
          </marker>
          <marker id="sems-domain-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4f5d75" stroke-width="1"/>
          </marker>
        </defs>

        <rect width="960" height="600" fill="#f5f5f5"/>

        <line x1="280" y1="120" x2="360" y2="120" stroke="#4f5d75" stroke-width="1" marker-end="url(#sems-domain-open)"/>
        <line x1="480" y1="296" x2="480" y2="224" stroke="#4f5d75" stroke-width="1" marker-end="url(#sems-domain-open)"/>
        <path d="M 360,360 H 168 Q 160,360 160,352 V 208" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#sems-domain-open)"/>

        <rect x="292" y="100" width="32" height="12" fill="#f5f5f5"/>
        <text x="308" y="109" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">0..1</text>
        <rect x="328" y="100" width="20" height="12" fill="#f5f5f5"/>
        <text x="338" y="109" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

        <rect x="488" y="236" width="20" height="12" fill="#f5f5f5"/>
        <text x="498" y="245" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>
        <rect x="488" y="272" width="32" height="12" fill="#f5f5f5"/>
        <text x="504" y="281" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">0..*</text>

        <rect x="238" y="340" width="52" height="12" fill="#f5f5f5"/>
        <text x="264" y="349" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REVIEWER</text>
        <rect x="316" y="340" width="32" height="12" fill="#f5f5f5"/>
        <text x="332" y="349" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">0..*</text>
        <rect x="170" y="220" width="32" height="12" fill="#f5f5f5"/>
        <text x="186" y="229" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">0..1</text>

        <rect x="40" y="44" width="240" height="164" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="40" y1="84" x2="280" y2="84" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <line x1="40" y1="176" x2="280" y2="176" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="160" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">UserAccount</text>
        <text x="56" y="100" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- username: String</text>
        <text x="56" y="116" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- passwordHash: String</text>
        <text x="56" y="132" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- role: Role</text>
        <text x="56" y="148" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- active: boolean</text>
        <text x="56" y="164" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- createdAt: String</text>
        <text x="56" y="192" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ deactivate(): void</text>

        <rect x="360" y="44" width="240" height="180" rx="6" fill="#ffffff"/>
        <rect x="360" y="44" width="240" height="180" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <line x1="360" y1="84" x2="600" y2="84" stroke="rgba(191,69,32,0.40)" stroke-width="1"/>
        <line x1="360" y1="176" x2="600" y2="176" stroke="rgba(191,69,32,0.40)" stroke-width="1"/>
        <text x="480" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Employee</text>
        <text x="376" y="100" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- employeeNumber: String</text>
        <text x="376" y="116" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- firstName: String</text>
        <text x="376" y="132" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- lastName: String</text>
        <text x="376" y="148" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- email: String</text>
        <text x="376" y="164" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- status: EmployeeStatus</text>
        <text x="376" y="192" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ update(...): void</text>
        <text x="376" y="208" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ deactivate(): void</text>

        <rect x="680" y="44" width="240" height="136" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="680" y1="84" x2="920" y2="84" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="800" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AuditEvent</text>
        <text x="696" y="100" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- occurredAt: String</text>
        <text x="696" y="116" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- actorUsername: String</text>
        <text x="696" y="132" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- eventType: AuditEventType</text>
        <text x="696" y="148" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- action: AuditAction</text>
        <text x="696" y="164" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- outcome: AuditOutcome</text>

        <rect x="360" y="296" width="240" height="180" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="360" y1="336" x2="600" y2="336" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <line x1="360" y1="428" x2="600" y2="428" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="480" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LeaveRequest</text>
        <text x="376" y="352" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- startDate: LocalDate</text>
        <text x="376" y="368" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- endDate: LocalDate</text>
        <text x="376" y="384" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- reason: String</text>
        <text x="376" y="400" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- status: LeaveStatus</text>
        <text x="376" y="416" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- reviewedAt: String</text>
        <text x="376" y="444" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ approve(reviewer): void</text>
        <text x="376" y="460" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ reject(reviewer): void</text>

        <line x1="40" y1="548" x2="920" y2="548" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <line x1="40" y1="584" x2="68" y2="584" stroke="#2d3142" stroke-width="1" marker-end="url(#sems-domain-triangle)"/>
        <text x="76" y="588" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Inheritance</text>

        <line x1="168" y1="584" x2="196" y2="584" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#sems-domain-triangle)"/>
        <text x="204" y="588" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Realization</text>

        <line x1="300" y1="584" x2="328" y2="584" stroke="#2d3142" stroke-width="1" marker-start="url(#sems-domain-diamond-filled)"/>
        <text x="336" y="588" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Composition</text>

        <line x1="436" y1="584" x2="464" y2="584" stroke="#2d3142" stroke-width="1" marker-start="url(#sems-domain-diamond-hollow)"/>
        <text x="472" y="588" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Aggregation</text>

        <line x1="568" y1="584" x2="596" y2="584" stroke="#4f5d75" stroke-width="1" marker-end="url(#sems-domain-open)"/>
        <text x="604" y="588" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Association</text>

        <line x1="704" y1="584" x2="732" y2="584" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#sems-domain-open)"/>
        <text x="740" y="588" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Dependency</text>
      </svg>
    </div>
  </div>
</body>
</html>
