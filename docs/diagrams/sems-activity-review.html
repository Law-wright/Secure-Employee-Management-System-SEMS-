<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review leave activity</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Activity · manager review</p>
    <h1>Review leave</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sems-activity-review-title sems-activity-review-desc">
        <title id="sems-activity-review-title">Review leave</title>
        <desc id="sems-activity-review-desc">A manager can decide a leave request only while it is pending and only when the request belongs to someone else. The decision is then audited.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="280" y1="68" x2="280" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="280" y1="152" x2="280" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="220" x2="440" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="280" y1="264" x2="280" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="360" x2="440" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="280" y1="404" x2="280" y2="440" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="280" y1="496" x2="280" y2="528" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <rect x="376" y="200" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="390" y="209" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="288" y="276" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="304" y="285" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="376" y="340" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="392" y="349" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="288" y="412" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="302" y="421" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

        <rect x="200" y="28" width="160" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="200" y="28" width="160" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Start</text>

        <rect x="170" y="96" width="220" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="170" y="96" width="220" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Load the request</text>

        <polygon points="280,176 360,220 280,264 200,220" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Pending?</text>

        <rect x="440" y="192" width="200" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="440" y="192" width="200" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="540" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Already decided</text>

        <polygon points="280,316 360,360 280,404 200,360" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Own request?</text>

        <rect x="440" y="332" width="240" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="440" y="332" width="240" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="560" y="364" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Refuse self-review</text>

        <rect x="170" y="440" width="220" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="170" y="440" width="220" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Approve or reject</text>
        <text x="280" y="482" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">then audit</text>

        <rect x="200" y="528" width="160" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="200" y="528" width="160" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="552" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Done</text>

        <line x1="40" y1="608" x2="920" y2="608" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="632" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="620" width="28" height="16" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <text x="156" y="632" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Start or end</text>
        <polygon points="260,628 268,620 276,628 268,636" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="284" y="632" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Decision</text>
        <line x1="370" y1="628" x2="402" y2="628" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="410" y="632" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Allowed decision</text>
      </svg>
    </div>
  </div>
</body>
</html>
