<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-in lockout states</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · active account</p>
    <h1>Sign-in lockout states</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sems-state-lockout-title sems-state-lockout-desc">
        <title id="sems-state-lockout-title">Sign-in lockout states</title>
        <desc id="sems-state-lockout-desc">An active account counts wrong passwords, locks for 15 minutes on the fifth, restarts that window on another failure, and clears the count after a successful sign-in or after the window ends.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="78" y1="220" x2="160" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="328" y1="220" x2="420" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="608" y1="220" x2="700" y2="220" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- counting self-loop -->
        <path d="M 494,180 V 148 Q 494,140 502,140 H 526 Q 534,140 534,148 V 180" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- locked self-loop -->
        <path d="M 764,180 V 148 Q 764,140 772,140 H 796 Q 804,140 804,148 V 180" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- sign-in back to clear, upper return -->
        <path d="M 514,260 V 332 H 218 Q 210,332 210,324 V 260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- window ends, hops over the sign-in return -->
        <path d="M 784,260 V 392 H 286 Q 278,392 278,384 V 340 a 8,8 0 0,1 0,-16 V 260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <rect x="338" y="200" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="374" y="209" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BAD PASSWORD</text>
        <rect x="618" y="200" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="654" y="209" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FIFTH FAIL</text>
        <rect x="458" y="118" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="494" y="127" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FAIL AGAIN</text>
        <rect x="728" y="118" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="764" y="127" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RETRY LOCK</text>
        <rect x="330" y="312" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="358" y="321" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SIGN IN</text>
        <rect x="470" y="372" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="514" y="381" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WINDOW ENDS</text>

        <circle cx="64" cy="220" r="6" fill="#2d3142"/>

        <rect x="160" y="180" width="168" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="160" y="180" width="168" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="244" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Clear</text>
        <text x="244" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0 failed attempts</text>

        <rect x="420" y="180" width="188" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="420" y="180" width="188" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="514" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Counting</text>
        <text x="514" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1 to 4 failures</text>

        <rect x="700" y="180" width="168" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="700" y="180" width="168" height="80" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
        <text x="784" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Locked</text>
        <text x="784" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">15 minutes</text>

        <line x1="40" y1="456" x2="920" y2="456" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="468" width="16" height="16" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
        <text x="144" y="480" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Account cannot sign in</text>
        <text x="320" y="480" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Unknown and inactive names are counted in memory, not on this row</text>
      </svg>
    </div>
  </div>
</body>
</html>
