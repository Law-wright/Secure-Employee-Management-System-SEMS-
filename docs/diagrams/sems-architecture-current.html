<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEMS runtime architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · current state</p>
    <h1>SEMS runtime architecture</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sems-architecture-current-title sems-architecture-current-desc">
        <title id="sems-architecture-current-title">SEMS runtime architecture</title>
        <desc id="sems-architecture-current-desc">A browser on port 8080 reaches Spring Security, then Thymeleaf controllers and domain services, which read and write one local SQLite file.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- zones -->
        <rect x="32" y="108" width="200" height="168" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="248" y="108" width="444" height="292" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="712" y="108" width="212" height="168" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="86" y="112" width="92" height="14" rx="2" fill="#f5f5f5"/>
        <text x="132" y="123" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">BROWSER</text>
        <rect x="414" y="112" width="112" height="14" rx="2" fill="#f5f5f5"/>
        <text x="470" y="123" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">APPLICATION</text>
        <rect x="786" y="112" width="64" height="14" rx="2" fill="#f5f5f5"/>
        <text x="818" y="123" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">DATA</text>

        <!-- arrows before nodes -->
        <line x1="212" y1="208" x2="272" y2="208" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="440" y1="208" x2="500" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="580" y1="248" x2="580" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 652,328 H 812 Q 820,328 820,320 V 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <rect x="220" y="188" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="242" y="197" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>
        <rect x="448" y="188" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="470" y="197" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ROLES</text>
        <rect x="588" y="258" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="610" y="267" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CALLS</text>
        <rect x="768" y="278" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="790" y="287" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">JDBC</text>

        <!-- Browser -->
        <rect x="52" y="168" width="160" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="52" y="168" width="160" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="132" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Browser</text>
        <text x="132" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">localhost:8080</text>

        <!-- Security focal -->
        <rect x="272" y="168" width="168" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="272" y="168" width="168" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
        <text x="356" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Spring Security</text>
        <text x="356" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">form login, roles</text>

        <!-- Controllers -->
        <rect x="500" y="168" width="160" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="500" y="168" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="580" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Controllers</text>
        <text x="580" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Thymeleaf MVC</text>

        <!-- Services -->
        <rect x="484" y="292" width="168" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="484" y="292" width="168" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="568" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Domain services</text>
        <text x="568" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">employee, leave, audit</text>

        <!-- SQLite -->
        <rect x="736" y="168" width="168" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="736" y="168" width="168" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="820" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">SQLite</text>
        <text x="820" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">data/sems.db</text>

        <line x1="40" y1="452" x2="920" y2="452" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="476" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="466" width="14" height="14" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580"/>
        <text x="142" y="477" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Browser</text>
        <rect x="230" y="466" width="14" height="14" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
        <text x="252" y="477" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Security gate</text>
        <rect x="370" y="466" width="14" height="14" rx="2" fill="#ffffff" stroke="#2d3142"/>
        <text x="392" y="477" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Application</text>
        <rect x="500" y="466" width="14" height="14" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
        <text x="522" y="477" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Store</text>
        <line x1="590" y1="473" x2="618" y2="473" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="626" y="477" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">HTTP</text>
      </svg>
    </div>
  </div>
</body>
</html>
