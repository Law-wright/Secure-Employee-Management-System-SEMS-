<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave request states</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · leave request</p>
    <h1>Leave request states</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sems-state-leave-title sems-state-leave-desc">
        <title id="sems-state-leave-title">Leave request states</title>
        <desc id="sems-state-leave-desc">A leave request is created pending, then a manager approves or rejects it. Approved and rejected requests cannot be reviewed again.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- submit -->
        <line x1="80" y1="216" x2="140" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- approve into the bottom of Approved -->
        <path d="M 324,196 H 576 Q 584,196 584,188 V 136" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- reject into the top of Rejected -->
        <path d="M 324,236 H 576 Q 584,236 584,244 V 292" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="684" y1="100" x2="744" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="684" y1="328" x2="744" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <rect x="84" y="196" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="110" y="205" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SUBMIT</text>
        <rect x="400" y="176" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="432" y="185" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">APPROVE</text>
        <rect x="404" y="216" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="432" y="225" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REJECT</text>
        <rect x="692" y="80" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="712" y="89" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DONE</text>
        <rect x="692" y="308" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="712" y="317" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DONE</text>

        <circle cx="64" cy="216" r="6" fill="#2d3142"/>

        <rect x="140" y="176" width="184" height="80" rx="8" fill="#f5f5f5"/>
        <rect x="140" y="176" width="184" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="232" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Pending</text>
        <text x="232" y="230" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">LeaveStatus.PENDING</text>

        <rect x="500" y="64" width="184" height="72" rx="8" fill="#f5f5f5"/>
        <rect x="500" y="64" width="184" height="72" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
        <text x="592" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Approved</text>
        <text x="592" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">terminal</text>

        <rect x="500" y="292" width="184" height="72" rx="8" fill="#f5f5f5"/>
        <rect x="500" y="292" width="184" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="592" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Rejected</text>
        <text x="592" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">terminal</text>

        <circle cx="760" cy="100" r="8" fill="none" stroke="#2d3142" stroke-width="1.4"/>
        <circle cx="760" cy="100" r="5" fill="#2d3142"/>
        <circle cx="760" cy="328" r="8" fill="none" stroke="#2d3142" stroke-width="1.4"/>
        <circle cx="760" cy="328" r="5" fill="#2d3142"/>

        <line x1="40" y1="420" x2="920" y2="420" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <circle cx="128" cy="440" r="6" fill="#2d3142"/>
        <text x="144" y="444" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Start</text>
        <rect x="200" y="432" width="16" height="16" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
        <text x="224" y="444" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Completed approval</text>
        <circle cx="380" cy="440" r="8" fill="none" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="380" cy="440" r="4" fill="#2d3142"/>
        <text x="396" y="444" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">End</text>
      </svg>
    </div>
  </div>
</body>
</html>
