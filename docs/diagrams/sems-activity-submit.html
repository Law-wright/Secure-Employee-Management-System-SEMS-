<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit leave activity</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Activity · submit leave</p>
    <h1>Submit leave</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sems-activity-submit-title sems-activity-submit-desc">
        <title id="sems-activity-submit-title">Submit leave</title>
        <desc id="sems-activity-submit-desc">An authenticated employee submits dates and a reason. Invalid input is shown on the form. A valid request is saved as pending, audited, and listed on My leave.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="300" y1="80" x2="300" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="176" x2="300" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="380" y1="256" x2="460" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="316" x2="300" y2="348" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="300" y1="412" x2="300" y2="444" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="508" x2="300" y2="540" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <rect x="396" y="236" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="410" y="245" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="308" y="322" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="324" y="331" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

        <rect x="220" y="36" width="160" height="44" rx="20" fill="#f5f5f5"/>
        <rect x="220" y="36" width="160" height="44" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Start</text>

        <rect x="180" y="112" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="180" y="112" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Submit the form</text>
        <text x="300" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">dates and reason</text>

        <polygon points="300,196 380,256 300,316 220,256" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Valid?</text>
        <text x="300" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">today, 30 days</text>

        <rect x="460" y="224" width="220" height="64" rx="20" fill="#f5f5f5"/>
        <rect x="460" y="224" width="220" height="64" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="570" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Show field error</text>
        <text x="570" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">form stays open</text>

        <rect x="180" y="348" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="180" y="348" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Save pending request</text>
        <text x="300" y="394" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">owner is current user</text>

        <rect x="180" y="444" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="180" y="444" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Audit the submit</text>
        <text x="300" y="490" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">LEAVE / SUBMIT</text>

        <rect x="220" y="540" width="160" height="44" rx="20" fill="#f5f5f5"/>
        <rect x="220" y="540" width="160" height="44" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="566" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">My leave</text>

        <line x1="40" y1="616" x2="920" y2="616" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="640" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="628" width="28" height="16" rx="8" fill="#ffffff" stroke="#2d3142"/>
        <text x="156" y="640" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Start or end</text>
        <rect x="260" y="628" width="16" height="16" rx="2" fill="#ffffff" stroke="#2d3142"/>
        <text x="284" y="640" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Action</text>
        <polygon points="360,636 368,628 376,636 368,644" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="384" y="640" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Decision</text>
        <line x1="470" y1="636" x2="502" y2="636" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="510" y="640" fill="#4f5d75" font-size="8" font-family="'Geist', system-ui, sans-serif">Accepted request</text>
      </svg>
    </div>
  </div>
</body>
</html>
