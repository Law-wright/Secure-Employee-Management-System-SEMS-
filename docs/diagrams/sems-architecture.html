<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEMS architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1040px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.75rem;
    }

    .note {
      font-size: 0.95rem;
      line-height: 1.45;
      color: var(--color-muted);
      max-width: 42rem;
      margin-bottom: 1.5rem;
    }

    .diagram-container { width: 100%; overflow-x: auto; }

    svg { width: 100%; min-width: 960px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>SEMS runtime</h1>
    <p class="note">One Spring Boot process on port 8080. The browser signs in through form login, Thymeleaf pages call the employee and leave services, and both those services and the login path append to the audit log. The database is the SQLite file at data/sems.db.</p>

    <div class="diagram-container">

        <desc id="sems-arch-desc">Architecture of the SEMS Spring Boot app: the browser passes Spring Security, then Thymeleaf and services, with audit and SQLite beside the request path.</desc>

          <marker id="sems-arch-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="960" height="600" fill="#f5f5f5"/>

        <rect x="40" y="136" width="144" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="88" y="140" width="48" height="12" rx="2" fill="#f5f5f5"/>

        <rect x="208" y="136" width="544" height="264" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <text x="480" y="149" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">APPLICATION</text>

        <rect x="776" y="136" width="144" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="824" y="140" width="48" height="12" rx="2" fill="#f5f5f5"/>

        <path d="M 292,240 V 264 Q 292,272 300,272 H 448 Q 456,272 456,280 V 312" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#sems-arch-arrow)"/>
        <path d="M 668,240 V 264 Q 668,272 660,272 H 512 Q 504,272 504,280 V 312" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sems-arch-arrow)"/>
        <path d="M 548,348 H 840 Q 848,348 848,340 V 240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sems-arch-arrow)"/>

        <rect x="180" y="184" width="32" height="12" fill="#f5f5f5"/>
        <text x="196" y="193" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>

        <rect x="354" y="252" width="40" height="12" fill="#f5f5f5"/>

        <rect x="674" y="328" width="40" height="12" fill="#f5f5f5"/>
        <text x="694" y="337" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>

        <rect x="220" y="168" width="144" height="72" rx="6" fill="#ffffff"/>
        <rect x="220" y="168" width="144" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>

        <text x="292" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Form login · roles</text>

        <rect x="412" y="168" width="136" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web</text>
        <text x="480" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Thymeleaf · :8080</text>

        <rect x="596" y="168" width="144" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

        <text x="668" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Employee · leave</text>

        <rect x="412" y="312" width="136" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="342" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Audit</text>
        <text x="480" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Login and changes</text>

        <rect x="788" y="168" width="120" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="788" y="168" width="120" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="848" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQLite</text>
        <text x="848" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">data/sems.db</text>

        <line x1="40" y1="548" x2="920" y2="548" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <line x1="40" y1="584" x2="68" y2="584" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#sems-arch-link)"/>
        <text x="76" y="588" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">HTTP</text>

        <line x1="160" y1="584" x2="188" y2="584" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sems-arch-arrow)"/>
        <text x="196" y="588" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Call</text>

        <line x1="280" y1="584" x2="308" y2="584" stroke="#bf4520" stroke-width="1.4" marker-end="url(#sems-arch-accent)"/>
        <text x="316" y="588" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Allowed request</text>

        <line x1="460" y1="584" x2="488" y2="584" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#sems-arch-arrow)"/>
        <text x="496" y="588" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Login audit</text>
      </svg>
    </div>
  </div>
</body>
</html>
