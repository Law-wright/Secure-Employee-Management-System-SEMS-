<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Profile · SEMS</title>
    <link rel="stylesheet" th:href="@{/css/sems.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <h1>Profile</h1>
    <p>Signed in as <strong sec:authentication="name">user</strong>.</p>
    <dl th:if="${employee}">
        <dt>Employee number</dt>
        <dd th:text="${employee.employeeNumber}"></dd>
        <dt>Name</dt>
        <dd th:text="${employee.firstName + ' ' + employee.lastName}"></dd>
        <dt>Email</dt>
        <dd th:text="${employee.email}"></dd>
        <dt>Job title</dt>
        <dd th:text="${employee.jobTitle}"></dd>
        <dt>Status</dt>
        <dd th:text="${employee.status}"></dd>
    </dl>
</main>
</body>
</html>
