<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign in · SEMS</title>
    <link rel="stylesheet" th:href="@{/css/sems.css}">
</head>
<body>
<main class="narrow">
    <h1 class="login-brand"><svg th:replace="~{fragments/logo :: mark}"></svg><span>SEMS</span></h1>
    <p class="lede">Sign in to the Secure Employee Management System.</p>
    <div id="login-feedback"
         th:attr="data-locked=${attempt.locked},data-locked-until=${attempt.lockedUntil},data-server-now=${attempt.serverNow}">
        <p id="login-announcer" class="visually-hidden" role="status" aria-live="polite"></p>
        <p class="message error" role="alert" th:if="${param.error != null and !attempt.locked}">Invalid username or password.</p>
        <div id="lockout-notice" class="message error" th:if="${attempt.locked}">
            <p id="lockout-status" role="status" aria-live="polite">This account has been locked out.</p>
            <p id="lockout-timer">Time remaining: <span id="lockout-countdown" th:text="${attempt.countdownText}">15 minutes 0 seconds</span>.</p>
        </div>
        <p id="attempts-remaining" class="message error" role="status" aria-live="polite"
           th:if="${attempt.showRemainingAttempts}" th:text="${attempt.remainingMessage}">3 login attempts remaining.</p>
    </div>
    <p class="message" th:if="${param.logout}">You have been signed out.</p>
    <form class="stack" th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
</main>
<script th:src="@{/js/login-feedback.js}"></script>
</body>
</html>
