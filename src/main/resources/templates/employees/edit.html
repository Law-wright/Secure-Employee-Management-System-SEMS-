<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit employee · SEMS</title>
    <link rel="stylesheet" th:href="@{/css/sems.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <h1>Edit employee</h1>
    <p th:text="|Employee ${employee.employeeNumber}|"></p>
    <form th:action="@{/employees/{id}(id=${employee.id})}" th:object="${employeeForm}" method="post">
        <div class="message error" th:if="${#fields.hasGlobalErrors()}"
             th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>

        <label for="firstName">First name</label>
        <input id="firstName" th:field="*{firstName}" maxlength="50" required>
        <span class="field-error" th:errors="*{firstName}"></span>

        <label for="lastName">Last name</label>
        <input id="lastName" th:field="*{lastName}" maxlength="50" required>
        <span class="field-error" th:errors="*{lastName}"></span>

        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}" maxlength="100" required>
        <span class="field-error" th:errors="*{email}"></span>

        <label for="jobTitle">Job title</label>
        <input id="jobTitle" th:field="*{jobTitle}" maxlength="80" required>
        <span class="field-error" th:errors="*{jobTitle}"></span>

        <button type="submit">Save changes</button>
        <a class="secondary-link" th:href="@{/employees/{id}(id=${employee.id})}">Cancel</a>
    </form>
</main>
</body>
</html>
