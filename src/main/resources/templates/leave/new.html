<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Request leave · SEMS</title>
    <link rel="stylesheet" th:href="@{/css/sems.css}">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <h1>Request leave</h1>
    <p>Request up to 30 days, starting today or later.</p>
    <form th:action="@{/leave}" th:object="${leaveForm}" method="post">
        <div class="message error" th:if="${#fields.hasGlobalErrors()}"
             th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>

        <label for="startDate">Start date</label>
        <input id="startDate" type="date" th:field="*{startDate}" required>
        <span class="field-error" th:errors="*{startDate}"></span>

        <label for="endDate">End date</label>
        <input id="endDate" type="date" th:field="*{endDate}" required>
        <span class="field-error" th:errors="*{endDate}"></span>

        <label for="reason">Reason</label>
        <textarea id="reason" th:field="*{reason}" maxlength="500" rows="5" required></textarea>
        <span class="field-error" th:errors="*{reason}"></span>

        <button type="submit">Submit request</button>
        <a class="secondary-link" th:href="@{/leave/mine}">Cancel</a>
    </form>
</main>
</body>
</html>
