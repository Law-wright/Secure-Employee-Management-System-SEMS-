<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header">
    <a class="brand" th:href="@{/}">SEMS</a>
    <nav sec:authorize="isAuthenticated()">
        <a th:href="@{/profile}">Profile</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/employees}">Employees</a>
        <a sec:authorize="hasRole('MANAGER')" th:href="@{/leave/review}">Leave review</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/audit}">Audit log</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Log out</button>
        </form>
    </nav>
</header>
</body>
</html>
